<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Mapa de Escuelas Primarias</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
  <style>
    /* ══════════════════════════════════════
       VARIABLES
    ══════════════════════════════════════ */
    :root {
      --accent:  #e6b84a;
      --accent2: #c9783e;
      --dur: .28s;
    }
    [data-theme="dark"] {
      --bg:     #0d1117;
      --panel:  #161b22;
      --panel2: #1c2330;
      --border: #30363d;
      --text:   #e6edf3;
      --muted:  #8b949e;
      --hover:  rgba(255,255,255,.05);
      --shadow: 0 4px 20px rgba(0,0,0,.5);
      --scroll: #30363d;
      --c071: #4ec9b0;
      --c013: #569cd6;
      --c128: #d4c850;
      --c140: #c586c0;
    }
    [data-theme="light"] {
      --bg:     #f0f4f9;
      --panel:  #ffffff;
      --panel2: #f5f7fa;
      --border: #d9e0ea;
      --text:   #1a2332;
      --muted:  #64748b;
      --hover:  rgba(0,0,0,.04);
      --shadow: 0 4px 16px rgba(0,0,0,.10);
      --scroll: #c2cdd8;
      --c071: #0a9070;
      --c013: #1a65b8;
      --c128: #7a6a00;
      --c140: #7a3fa0;
    }

    /* ══════════════════════════════════════
       RESET
    ══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      overflow: hidden;
      transition: background var(--dur), color var(--dur);
    }

    /* ══════════════════════════════════════
       LAYOUT — CSS Grid
       Escritorio: header | sidebar + mapa
       Móvil:      header | sidebar | mapa
    ══════════════════════════════════════ */
    .app {
      display: grid;
      height: 100vh;
      grid-template-rows: 50px 1fr;
      grid-template-columns: 290px 1fr;
      grid-template-areas:
        "hdr hdr"
        "side map";
    }

    /* ══════════════════════════════════════
       HEADER
    ══════════════════════════════════════ */
    .hdr {
      grid-area: hdr;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 1100;
      transition: background var(--dur), border-color var(--dur);
    }
    .logo {
      display: flex; align-items: center; gap: 9px; min-width: 0;
    }
    .logo-icon {
      width: 30px; height: 30px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .logo-text {
      font-size: clamp(.78rem, 2vw, 1rem);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color var(--dur);
    }
    .logo-text span { color: var(--accent); }

    .hdr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .hdr-meta {
      font-size: .7rem; color: var(--muted); text-align: right; line-height: 1.4;
      transition: color var(--dur);
    }
    .hdr-meta strong { color: var(--accent); }

    /* Toggle */
    .toggle-wrap {
      display: flex; align-items: center; gap: 5px;
      cursor: pointer; user-select: none;
    }
    .t-ico { font-size: 13px; }
    .t-track {
      position: relative;
      width: 38px; height: 20px; border-radius: 10px;
      background: var(--border); border: 1.5px solid var(--border);
      transition: background var(--dur), border-color var(--dur);
      cursor: pointer;
    }
    [data-theme="light"] .t-track { background: var(--accent); border-color: var(--accent); }
    .t-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 13px; height: 13px; border-radius: 50%;
      background: #fff;
      transition: transform .22s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    [data-theme="light"] .t-thumb { transform: translateX(18px); }
    .t-lbl {
      font-size: .65rem; font-weight: 600; color: var(--muted);
      min-width: 28px; transition: color var(--dur);
    }

    /* ══════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════ */
    .side {
      grid-area: side;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border-right: 1px solid var(--border);
      transition: background var(--dur), border-color var(--dur);
    }

    /* Parte fija: búsqueda + filtros */
    .side-top {
      flex-shrink: 0;
      padding: 11px 11px 9px;
      border-bottom: 1px solid var(--border);
      transition: border-color var(--dur);
    }
    .side-top h2 {
      font-size: .8rem; font-weight: 700;
      color: var(--accent); margin-bottom: 8px;
    }
    .search-wrap { position: relative; margin-bottom: 8px; }
    .search-wrap input {
      width: 100%;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 7px; color: var(--text);
      padding: 6px 9px 6px 27px;
      font-size: .78rem; font-family: inherit;
      outline: none;
      transition: border-color .18s, background var(--dur), color var(--dur);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: var(--accent); }
    .s-ico {
      position: absolute; left: 8px; top: 50%;
      transform: translateY(-50%); opacity: .4;
      font-size: 11px; pointer-events: none;
    }
    .f-lbl {
      font-size: .62rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
      transition: color var(--dur);
    }
    .filters { display: flex; flex-wrap: wrap; gap: 4px; }
    .fbtn {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 20px; border: 1.5px solid;
      font-size: .66rem; font-family: inherit;
      cursor: pointer; transition: all .15s;
      background: transparent; font-weight: 600;
    }
    .fbtn .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* per-sector colours */
    .fbtn[data-s="todos"]       { border-color: var(--accent); color: var(--accent); }
    .fbtn[data-s="todos"].on    { background: var(--accent); color: #111; }
    .fbtn[data-s="071"]         { border-color: var(--c071); color: var(--c071); }
    .fbtn[data-s="071"].on      { background: var(--c071); color: #fff; }
    .fbtn[data-s="013"]         { border-color: var(--c013); color: var(--c013); }
    .fbtn[data-s="013"].on      { background: var(--c013); color: #fff; }
    .fbtn[data-s="128"]         { border-color: var(--c128); color: var(--c128); }
    .fbtn[data-s="128"].on      { background: var(--c128); color: #111; }
    .fbtn[data-s="140"]         { border-color: var(--c140); color: var(--c140); }
    .fbtn[data-s="140"].on      { background: var(--c140); color: #fff; }

    /* Lista scrolleable */
    .school-list {
      flex: 1; min-height: 0;
      overflow-y: auto; padding: 5px;
      scrollbar-width: thin;
      scrollbar-color: var(--scroll) transparent;
    }
    .sitem {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 7px; border-radius: 7px; cursor: pointer;
      border: 1px solid transparent;
      transition: background .13s, border-color .13s;
    }
    .sitem:hover  { background: var(--hover); border-color: var(--border); }
    .sitem.active {
      background: color-mix(in srgb, var(--accent) 9%, transparent);
      border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .sdot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .sinfo { min-width: 0; flex: 1; }
    .sinfo h3 {
      font-size: .75rem; font-weight: 600; line-height: 1.3;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color var(--dur);
    }
    .sinfo p {
      font-size: .66rem; color: var(--muted); line-height: 1.3; margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color var(--dur);
    }
    .srow { display: flex; align-items: center; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
    .stag {
      font-size: .58rem; padding: 1px 5px; border-radius: 4px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .sclave { font-size: .57rem; color: var(--muted); font-family: monospace; transition: color var(--dur); }

    /* Barra de estado */
    .side-bot {
      flex-shrink: 0;
      padding: 6px 12px; border-top: 1px solid var(--border);
      font-size: .67rem; color: var(--muted);
      display: flex; justify-content: space-between;
      background: var(--panel2);
      transition: background var(--dur), border-color var(--dur);
    }
    .side-bot strong { color: var(--accent); }

    /* ══════════════════════════════════════
       MAPA  — ocupa todo el espacio restante
    ══════════════════════════════════════ */
    .map-area {
      grid-area: map;
      position: relative;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      color: var(--text) !important;
      box-shadow: var(--shadow) !important;
    }
    .leaflet-popup-tip { background: var(--panel) !important; }
    .leaflet-popup-content { margin: 0 !important; font-family: inherit; }
    .leaflet-popup-close-button {
      color: var(--muted) !important;
      top: 8px !important; right: 8px !important;
      font-size: 18px !important; line-height: 1 !important;
    }
    .popup-card { padding: 13px 14px; min-width: 200px; max-width: 250px; }
    .pbadge {
      display: inline-block; font-size: .58rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 20px; margin-bottom: 5px;
    }
    .popup-card h3 {
      font-size: .86rem; font-weight: 700; line-height: 1.3; margin-bottom: 3px;
      color: var(--text);
    }
    .pmeta  { font-size: .67rem; color: var(--muted); line-height: 1.5; }
    .pclave {
      display: inline-block; margin-top: 3px; margin-bottom: 9px;
      font-size: .6rem; font-family: monospace; color: var(--muted);
      background: var(--panel2); padding: 2px 5px; border-radius: 4px;
    }
    .pbtns { display: flex; gap: 6px; }
    .pbtn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 7px 8px; border-radius: 7px; border: none;
      font-size: .71rem; font-weight: 600; font-family: inherit;
      text-decoration: none; cursor: pointer;
      transition: filter .15s, box-shadow .15s;
    }
    .pbtn:hover { filter: brightness(1.1); }
    .pbtn-pri { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #111; }
    .pbtn-sec {
      background: var(--bg) !important;
      border: 1.5px solid var(--border) !important;
      color: var(--text) !important;
    }

    /* ── Clusters ── */
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large { background: rgba(230,184,74,.14) !important; }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background: rgba(230,184,74,.75) !important;
      color: #111 !important; font-weight: 700;
    }

    /* ── Leyenda ── */
    .legend {
      position: absolute; bottom: 22px; right: 10px; z-index: 500;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 9px; padding: 8px 11px;
      font-size: .67rem; box-shadow: var(--shadow);
      transition: background var(--dur), border-color var(--dur);
    }
    .legend h4 {
      font-size: .6rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
      transition: color var(--dur);
    }
    .lrow {
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
      color: var(--text); font-size: .65rem; transition: color var(--dur);
    }
    .lrow:last-child { margin-bottom: 0; }
    .ldot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ══════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════ */

    /* Tablet portrait */
    @media (max-width: 900px) {
      .app { grid-template-columns: 250px 1fr; }
    }

    /* Móvil: sidebar encima, mapa abajo */
    @media (max-width: 680px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 50px 40vh 1fr;
        grid-template-areas:
          "hdr"
          "side"
          "map";
      }
      .side { border-right: none; border-bottom: 1px solid var(--border); }
      .t-lbl { display: none; }
      .legend { bottom: 10px; right: 6px; }
    }

    /* Pantallas muy pequeñas */
    @media (max-width: 400px) {
      .hdr-meta { display: none; }
      .hdr { padding: 0 10px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ══ HEADER ══ -->
  <header class="hdr">
    <div class="logo">
      <div class="logo-icon">🏫</div>
      <span class="logo-text">Mapa de <span>Escuelas Primarias</span></span>
    </div>
    <div class="hdr-right">

        Sector 10 &nbsp;|&nbsp; Zonas 071 · 013 · 128 · 140
      </div>
      <div class="toggle-wrap" id="toggle" title="Modo día / noche">
        <span class="t-ico">🌙</span>
        <div class="t-track"><div class="t-thumb"></div></div>
        <span class="t-ico">☀️</span>
        <span class="t-lbl" id="t-lbl">Noche</span>
      </div>
    </div>
  </header>

  <!-- ══ SIDEBAR ══ -->
  <aside class="side">
    <div class="side-top">
      <h2>🔍 Explorar escuelas</h2>
      <div class="search-wrap">
        <span class="s-ico">🔎</span>
        <input type="search" id="q" placeholder="Nombre, comunidad o clave…"/>
      </div>
      <p class="f-lbl">Filtrar por zona</p>
      <div class="filters">
        <button class="fbtn on" data-s="todos"><span class="dot" style="background:var(--accent)"></span>Todos</button>
        <button class="fbtn" data-s="071"><span class="dot" style="background:var(--c071)"></span>Zona 071</button>
        <button class="fbtn" data-s="013"><span class="dot" style="background:var(--c013)"></span>Zona 013</button>
        <button class="fbtn" data-s="128"><span class="dot" style="background:var(--c128)"></span>Zona 128</button>
        <button class="fbtn" data-s="140"><span class="dot" style="background:var(--c140)"></span>Zona 140</button>
      </div>
    </div>

    <div class="school-list" id="list"></div>

    <div class="side-bot">
      <span>Mostrando <strong id="cnt">53</strong> escuelas</span>
      <span>📍 Oaxaca, Méx.</span>
    </div>
  </aside>

  <!-- ══ MAPA ══ -->
  <div class="map-area">
    <div id="map"></div>
    <div class="legend">
      <h4>Zona</h4>
      <div class="lrow"><div class="ldot" style="background:var(--c071)"></div>Zona 071</div>
      <div class="lrow"><div class="ldot" style="background:var(--c013)"></div>Zona 013</div>
      <div class="lrow"><div class="ldot" style="background:var(--c128)"></div>Zona 128</div>
      <div class="lrow"><div class="ldot" style="background:var(--c140)"></div>Zona 140</div>
    </div>
  </div>

</div><!-- .app -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

const SLABEL = { "071":"Zona 071","013":"Zona 013","128":"Zona 128","140":"Zona 140" };
const CDARK  = { "071":"#4ec9b0","013":"#569cd6","128":"#d4c850","140":"#c586c0" };
const CLIGHT = { "071":"#0a9070","013":"#1a65b8","128":"#7a6a00","140":"#7a3fa0" };

const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
const col    = () => isDark() ? CDARK : CLIGHT;

/* ══ MAPA — tiles OpenStreetMap (gratuito, sin API key) ══ */
const map = L.map('map', { center:[16.90,-97.00], zoom:10, zoomControl:false });
L.control.zoom({ position:'topright' }).addTo(map);

/* Dos estilos de tile gratuitos y sin autenticación:
   Oscuro  → CartoDB Dark Matter
   Claro   → CartoDB Positron                          */
const TILES = {
  dark:  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:20 }),
  light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    { attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:20 }),
};
TILES.dark.addTo(map);
let activeTile = 'dark';

const switchTile = t => {
  if (t === activeTile) return;
  map.removeLayer(TILES[activeTile]);
  TILES[t].addTo(map);
  activeTile = t;
};

/* ══ MARCADORES ══ */
const makeIcon = sector => {
  const c   = col()[sector];
  const uid = 'i' + (Math.random()*1e9|0);
  return L.divIcon({
    className: '',
    iconSize:    [30,40],
    iconAnchor:  [15,40],
    popupAnchor: [0,-38],
    html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40" width="30" height="40">
      <defs>
        <filter id="${uid}" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="${c}" flood-opacity=".55"/>
        </filter>
      </defs>
      <path d="M15 0C6.716 0 0 6.716 0 15c0 10.5 15 25 15 25S30 25.5 30 15C30 6.716 23.284 0 15 0z"
        fill="${c}" filter="url(#${uid})"/>
      <circle cx="15" cy="14" r="7" fill="rgba(0,0,0,.28)"/>
      <text x="15" y="18.5" text-anchor="middle" font-size="8.5" fill="white">🏫</text>
    </svg>`,
  });
};

/* ══ DETECCIÓN DE IFRAME ══
   Si la página corre dentro de un iframe (Google Sites),
   los enlaces deben usar target="_top" para salir del iframe.
   Si se accede directo (GitHub Pages), usan target="_blank". */
const linkTarget = (window.self !== window.top) ? '_top' : '_blank';

const buildPopup = s => {
  const c     = col()[s.sector];
  const route = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
  const view  = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
  const clave = s.clave !== '—' ? `<span class="pclave">${s.clave}</span>` : '';
  return `<div class="popup-card">
    <div class="pbadge" style="background:${c}22;color:${c}">${SLABEL[s.sector]}</div>
    <h3>${s.name}</h3>
    <p class="pmeta">📍 ${s.comunidad}</p>
    ${clave}
    <div class="pbtns">
      <a class="pbtn pbtn-pri" href="${route}" target="${linkTarget}" rel="noopener">🗺️ Cómo llegar</a>
      <a class="pbtn pbtn-sec" href="${view}"  target="${linkTarget}" rel="noopener">👁️ Ver</a>
    </div>
  </div>`;
};

const cluster = L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius:36 });
const markers = {};

schools.forEach((s, i) => {
  const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.sector) });
  m.bindPopup(buildPopup(s), { maxWidth:265 });
  cluster.addLayer(m);
  markers[i] = m;
});
map.addLayer(cluster);

const refreshMarkers = () =>
  schools.forEach((s, i) => {
    markers[i].setIcon(makeIcon(s.sector));
    markers[i].setPopupContent(buildPopup(s));
  });

/* ══ LISTA ══ */
let curFilter = 'todos';
let curQ      = '';
let curActive = null;

const renderList = () => {
  const ul = document.getElementById('list');
  ul.innerHTML = '';
  let n = 0;

  schools.forEach((s, i) => {
    if (curFilter !== 'todos' && s.sector !== curFilter) return;
    const q = curQ.toLowerCase();
    if (q && !s.name.toLowerCase().includes(q) &&
        !s.comunidad.toLowerCase().includes(q) &&
        !s.clave.toLowerCase().includes(q)) return;
    n++;
    const c  = col()[s.sector];
    const el = document.createElement('div');
    el.className = 'sitem' + (curActive === i ? ' active' : '');
    el.innerHTML = `
      <div class="sdot" style="background:${c}"></div>
      <div class="sinfo">
        <h3 title="${s.name}">${s.name}</h3>
        <p  title="${s.comunidad}">${s.comunidad}</p>
        <div class="srow">
          <span class="stag" style="background:${c}22;color:${c}">${SLABEL[s.sector]}</span>
          ${s.clave !== '—' ? `<span class="sclave">${s.clave}</span>` : ''}
        </div>
      </div>`;
    el.addEventListener('click', () => {
      curActive = i;
      renderList();
      map.setView([s.lat, s.lng], 14, { animate:true });
      setTimeout(() => markers[i].openPopup(), 380);
    });
    ul.appendChild(el);
  });

  document.getElementById('cnt').textContent = n;
};

/* ══ FILTROS ══ */
document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    curFilter = btn.dataset.s;
    cluster.clearLayers();
    schools.forEach((s, i) => {
      if (curFilter === 'todos' || s.sector === curFilter) cluster.addLayer(markers[i]);
    });
    renderList();
  });
});

document.getElementById('q').addEventListener('input', e => {
  curQ = e.target.value.trim();
  renderList();
});

/* ══ TOGGLE TEMA ══ */
let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
document.getElementById('toggle').addEventListener('click', () => {
  dark = !dark;
  const t = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('t-lbl').textContent = dark ? 'Noche' : 'Día';
  switchTile(t);
  refreshMarkers();
  renderList();
});

/* ══ INIT ══ */
renderList();

/* Leaflet necesita que el DOM esté pintado para medir el contenedor */
requestAnimationFrame(() => {
  setTimeout(() => map.invalidateSize(), 50);
});
window.addEventListener('resize', () => map.invalidateSize());
</script>
